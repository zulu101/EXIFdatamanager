name: Build & Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Swift-Version
        run: swift --version

      - name: Tests
        run: swift test

      - name: App bauen
        run: ./scripts/build-app.sh

      - uses: actions/upload-artifact@v4
        with:
          name: EXIF-Data-Manager
          path: build/EXIF Data Manager.zip
